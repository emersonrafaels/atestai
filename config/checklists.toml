# Checklist mínimo de evidências por CATEGORIA do chamado (+ tipo de manutenção e momento).
# Vale a regra mais específica que casar; "*" casa com qualquer valor.
# Cada requisito é atendido por pelo menos um anexo legível de uma das categorias aceitas.

[default.checklists.attachment_categories]
quote_doc = "Orçamento do fornecedor (planilha Excel padrão)"
completion_certificate_doc = "Termo de conclusão assinado pela agência"
technical_report_doc = "Relatório técnico, laudo, relatório de preventiva ou relatório/ordem de atendimento do técnico (inclusive preenchido à mão)"
price_reference_doc = "Print de anúncio, site de loja ou cotação mostrando preço de produto ou serviço (referência de mercado)"
room_before_photo = "Foto do local ou do problema ANTES do serviço (dano, defeito, estado anterior)"
room_after_photo = "Foto do local DEPOIS do serviço concluído"
equipment_photo = "Foto aproximada de equipamento ou componente (câmera, sensor, fonte, aparelho, peça)"
label_photo = "Foto da etiqueta ou placa de identificação de um produto instalado"
removed_items_photo = "Foto dos materiais ou equipamentos retirados"
cctv_screen_photo = "Imagem de câmera de segurança ou foto do monitor do gravador"
alarm_panel_photo = "Foto da central de alarme ou do teclado"
other = "Qualquer outra coisa"

# ------------------------------------------------------------------------------------------------
[[default.checklists.rules]]
category = "*"
maintenance = "*"
moment = "quote"
requirements = [
  { id = "quote", description = "Orçamento na planilha Excel padrão", accepted = ["quote_doc"] },
  { id = "problem_photo", description = "Foto do problema a ser corrigido", accepted = ["room_before_photo", "equipment_photo", "cctv_screen_photo"] },
]

[[default.checklists.rules]]
category = "*"
maintenance = "*"
moment = "execution"
requirements = [
  { id = "quote", description = "Orçamento na planilha Excel padrão", accepted = ["quote_doc"] },
  { id = "service_photo", description = "Foto do serviço executado", accepted = ["room_after_photo", "equipment_photo"] },
]

