# Atest.AI — configuração principal (Dynaconf)
#
# Ambientes: [default] vale para todos; [development] e [production] sobrescrevem.
# Escolha o ambiente com a variável ATEST_ENV (padrão: development).
# Qualquer chave pode ser sobrescrita por variável de ambiente com prefixo ATEST_,
# usando "__" para níveis:  ATEST_MODELS__MAIN="claude-opus-5-5"   ATEST_PIPELINE__PHASE=1
# Segredos (ANTHROPIC_API_KEY, IARA_CLIENT_ID/SECRET...) ficam em config/.secrets.toml (fora do git) ou no ambiente.
# Ajustes só da máquina (ex.: dentro do Itaú, usar a IARA) vão em config/settings.local.toml (fora do git;
# veja config/settings.itau.toml.example), carregado automaticamente depois deste arquivo.

[default]
version = "0.3.0"

[default.execution]
# o que `python main.py` faz: "panel" sobe o painel web; "batch" roda os chamados e grava as saídas;
# "validate" roda o conjunto de validação e aplica o portão de qualidade (use no CI antes de publicar prompt/modelo novo)
action = "panel"
mode = "simulated"          # "api" chama o provedor configurado; "simulated" responde pelo gabarito (sem custo, não mede qualidade)
tickets = []              # vazio = todos os chamados da pasta de dados
evaluate_against_ground_truth = true

[default.models]
# Formato "provedor:modelo". Provedores prontos: anthropic, openai, google (Gemini) e iara (IARA GenAI, dentro do Itaú;
# ex.: "iara:gpt-4.1" ou "iara:bedrock/<modelo>"). Sem prefixo = llm.default_provider.
# Fixe snapshots (ids com data) em produção; o id efetivamente usado pelo provedor fica gravado em cada chamada.
main = "anthropic:claude-sonnet-5-5"   # escopo, orçamento × escopo, fotos
fast = "anthropic:claude-sonnet-5-5"       # identificação dos anexos, redação do parecer

[default.models.tasks]
# sobrescreve o modelo de uma tarefa (identify_attachments, scope, quote_review, photos, assessment). Exemplos:
# photos = "google:<modelo-gemini>"
# assessment = "openai:<modelo-openai>"

[default.models.fallback]
# usado só se o modelo do papel falhar por erro transitório (sobrecarga, limite de taxa, indisponibilidade)
# main = "openai:<modelo-openai>"
# fast = "google:<modelo-gemini>"

[default.llm]
default_provider = "anthropic"
max_tokens = 8000
effort = ""                # vazio = padrão do modelo; ou low | medium | high | xhigh | max
timeout_s = 180
max_retries = 4
image_max_side = 1568
use_disk_cache = true    # não paga duas vezes pela mesma requisição

[default.llm.provider_options.iara]
# usado só quando algum modelo é "iara:..."
environment = "dev"          # dev | homol | prod
provider = "azure_openai"    # backend padrão da IARA: azure_openai | bedrock | vertex ("iara:bedrock/<modelo>" troca por modelo)
json_mode = "json_schema"    # se o backend recusar response_format com schema: "json_object" ou "prompt"
pdf_mode = "file"            # se o backend recusar PDF como arquivo: "text" (extrai o texto localmente; requer pypdf)
enable_polling = true
# modelos do catálogo que não leem imagem: servem para tarefas só de texto (scope, quote_review, assessment em
# [models.tasks]); como principal ou rápido eles falham nas fotos e nos anexos, e o painel os marca como "só texto"
text_only = [
  "gpt-oss-20b", "gpt-oss-120b", "amazon.nova-micro-v1:0",
  "llama3-8b-instruct", "llama3-70b-instruct", "llama3-3-70b-instruct", "llama3-1-70b-instruct", "llama3-1-8b-instruct",
  "qwen3-32b", "qwen3-coder-30b-a3b", "deepseek-v3.2", "deepseek-v4-pro", "deepseek-v4-flash",
  "mistral-7b-instruct", "mixtral-8x7b-instruct", "mistral-large-2402", "mistral-small-2402",
]

[default.llm.provider_options.iara.models]
# Catálogo da IARA (documentação "Modelos", coluna Model (SDK)), agrupado pelo backend (coluna Provider).
# Com ele, "iara:claude-sonnet-5" vai para o bedrock sem precisar escrever "iara:bedrock/claude-sonnet-5", e o
# painel lista estes modelos quando a IARA está selecionada. Ficam de fora os que não respondem chat com texto:
# embeddings (text-embedding-*, amazon.titan-embed-*, gemini-embedding-001), áudio (gpt-audio), geração de imagem
# (gemini-3-pro-image, gemini-3.1-flash-image) e os "-batch" (só pela Batch API, ainda não integrada).
azure_openai = [
  "gpt-6.1-sol", "gpt-6-luna", "gpt-5.6-terra", "gpt-5.6-luna", "gpt-5.5",
  "gpt-5.4", "gpt-5.4-mini", "gpt-5.4-nano", "gpt-5.2", "gpt-5.1",
  "gpt-5", "gpt-5-mini", "gpt-5-nano",
  "gpt-4.1", "gpt-4.1-mini", "gpt-4.1-nano", "gpt-4o", "gpt-4o-mini", "o3",
  "gpt-oss-20b", "gpt-oss-120b", "kimi-k3",
]
bedrock = [
  "claude-opus-5-5", "claude-sonnet-5", "claude-opus-4-8", "claude-opus-4-7", "claude-opus-4-6-v1", "claude-sonnet-4-6",
  "claude-opus-4-1-20250805",
  "amazon.nova-pro-v1:0", "amazon.nova-lite-v1:0", "amazon.nova-micro-v1:0",
  "llama4-maverick-17b-instruct", "llama4-scout-17b-instruct",
  "llama3-3-70b-instruct", "llama3-1-70b-instruct", "llama3-1-8b-instruct", "llama3-70b-instruct", "llama3-8b-instruct",
  "qwen3-32b", "qwen3-coder-30b-a3b",
  "deepseek-v4-pro", "deepseek-v4-flash", "deepseek-v3.2",
  "mistral-large-2402", "mistral-small-2402", "mixtral-8x7b-instruct", "mistral-7b-instruct",
  "gemma-3-27b-it", "gemma-3-12b-it", "gemma-3-4b-it",
]
vertex = [
  "gemini-3.6-flash", "gemini-3.5-flash", "gemini-3.5-flash-lite", "gemini-3.1-flash-lite", "gemini-2.5-flash",
]

[default.pipeline]
phase = 2                   # 1 = régua do MVP; 2 = inclui "antes", ilegibilidade, reaproveitamento e data das fotos
parallel = 3               # chamados em paralelo no modo síncrono

[default.batch]
# "sync": uma requisição por vez (resposta em segundos)
# "batch": Message Batches API (assíncrona, 50% mais barata; ideal para o batch horário)
kind = "sync"
batch_collect_window_s = 2.0      # espera para juntar as requisições de todos os chamados num mesmo lote
batch_poll_interval_s = 20  # intervalo entre consultas de status do lote
batch_max_hours = 24

[default.paths]
data = "data"
output = "output"
cache = ".cache/llm"
database = "output/atest.db"
logs = "output/logs"
upload_id_prefix = "9"   # chamados enviados pelo painel recebem ids 9xxxxxxx

[default.panel]
host = "0.0.0.0"
port = 8000
simulated_delay_s = 0.45   # só para o progresso ficar visível na demonstração

# Provedores que aparecem no seletor "Provedor" do painel, nesta ordem. Ao escolher um, o painel preenche os
# modelos principal e rápido abaixo (dá para trocar o modelo no próprio painel). Provedor sem credencial aparece
# desabilitado; enabled = false o esconde. O provedor de [models].main sempre aparece e começa selecionado, com os
# modelos de [models]. Ao escolher um provedor, as sobrescritas de [models.tasks] e [models.fallback] de outros
# provedores são ignoradas naquela execução (dentro do banco, nada sai pela Anthropic).
[default.panel.providers.anthropic]
label = "Anthropic"
main = "anthropic:claude-sonnet-5-5"
fast = "anthropic:claude-sonnet-5-5"

[default.panel.providers.iara]
label = "IARA (Itaú)"
main = "iara:claude-sonnet-5"   # bedrock pelo catálogo abaixo; lê imagem e PDF
fast = "iara:claude-sonnet-5"

[default.panel.providers.openai]
label = "OpenAI"
main = "openai:gpt-4.1"
fast = "openai:gpt-4.1-mini"
enabled = false            # mude para true para oferecer no painel (requer openai_api_key)

[default.panel.providers.google]
label = "Google Gemini"
main = "google:gemini-2.5-pro"
fast = "google:gemini-2.5-flash"
enabled = false            # mude para true para oferecer no painel (requer gemini_api_key)

[default.admin]
# Portal de configuração (aba Configuração do painel). Os usuários abaixo são criados no banco no primeiro uso;
# depois disso, senhas e novos usuários são geridos pelo próprio portal. Aqui fica só o hash PBKDF2, nunca a senha.
session_hours = 8          # duração da sessão após o login
max_failed_logins = 5      # tentativas erradas seguidas antes do bloqueio temporário
lockout_minutes = 5
seed_users = [
  { username = "emervin", password_hash = "pbkdf2_sha256$390000$lLeQW8rPW33XzE+bNVoCpQ==$Txv6N4w9QQnLJHmS+E8ER702gCbe4rFnJ8BoLazuf3Y=" },
]

[default.validation]
# portão de qualidade (ação "validate" e aba Validação do painel)
dataset = "validation"
accuracy_min = 0.85         # recomendação igual ao gabarito
kappa_min = 0.75            # concordância além do acaso
finding_f1_min = 0.80  # F1 micro dos apontamentos
score_error_max = 8.0        # erro absoluto médio do score (pontos)
bootstrap_samples = 1000   # intervalos de confiança de 95%
simulated_noise = 0.0        # só no modo simulado: probabilidade de o "modelo" errar cada decisão (para ver as métricas reagirem)

[default.observability]
level = "INFO"
log_json = true            # um evento por linha em output/logs/atest.jsonl
log_console = true

[default.costs]
# Preços em USD por milhão de tokens. Conferidos em nov/2026 na página de preços da Anthropic;
# revise antes de usar em orçamento oficial.
usd_brl_rate = 5.40
batch_discount = 0.50      # Message Batches API cobra metade em entrada e saída

[default.costs.prices.claude-sonnet-5-5]
input = 2.00
output = 10.00
cache_write = 2.50
cache_read = 0.10

[default.costs.prices.claude-haiku-5-5]
input = 0.10
output = 0.50
cache_write = 0.125
cache_read = 0.01

[default.costs.prices.claude-opus-5-5]
input = 4.00
output = 20.00
cache_write = 5.00
cache_read = 0.20

