# Cadastro de categorias, sintomas e locais do chamado (padrão de fábrica), conforme o Salesforce (Criar ocorrência).
# O portal de configuração (Configuração › Categorias, sintomas e locais) grava alterações por cima, com histórico; este arquivo não muda.
# - value: código gravado no chamado; label: nome na tela e nos prompts (como aparece no Salesforce).
# - workstreams: esteiras em que a categoria ou o local vale (vazio = SETA e SISR).
#   Infraestrutura = SETA; Segurança = SISR.
# - sintoma: categories = categorias em que vale (vazio = todas).
# - enabled = false: some das listas de escolha; chamados antigos continuam mostrando o nome.

