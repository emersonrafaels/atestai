# Régua do score de conformidade (deck v26). O modelo aponta; esta régua decide.
# Alterar aqui muda notas, score e recomendação sem tocar no código. Suba a versão a cada mudança.

[default.rubric]
version = "2026-11-v14"  # v14: categoria/sintoma conferidos com as evidências (vandalismo e desastre natural abertos com a causa errada levam à análise detalhada) e coerência da solução com o problema relatado; v13: item Não LPU com similar na LPU (preço comparado ao do similar; no máximo aprovar com ressalvas); v12: apontamento "preço sem referência para comparar" (leva no máximo a aprovar com ressalvas) e até 12 chamados da agência comparados; v11: janela de duplicidade da agência passa de 5 para 60 dias; v10: chamados da mesma agência (janela de dias + ainda abertos) e possível chamado duplicado, que leva à análise detalhada (review); v9: desconto proporcional ao que foi enviado (fração de fotos, itens, serviços, documentos ou valor), valor em questão limita a nota de Orçamento, faltas do fornecedor devolvem (serviço pedido sem item, item fora do escopo ou duplicado; 30% ou mais do orçamento em questão) e "serviço pedido sem item" deixa de reduzir a confiança; v8: serviço pedido sem item no orçamento, serviço executado antes da aprovação, valor em questão limita "Aprovar" e tolerância própria para preço de mercado; v7: quantidade cobrada acima do que as fotos mostram; v6: leitura de documentos (OCR): documento ilegível, de outro chamado, com data fora da janela e preço acima do mercado; v5: escopo vago alto, quantidade não verificável, item sem foto e valor divergente relevante; v4: absorção entre tipos (absorbs) e foto do depois com local não confirmado; v3: chaves em inglês

# peso de cada validação no score (somam 100)
weights = { scope = 20, quote = 40, photos = 40 }

# desconto por severidade; cada tipo de apontamento desconta uma vez por validação
discount_by_severity = { critical = 60, high = 35, medium = 15, low = 5 }
# Proporcional ao que foi enviado: o tipo desconta severidade × (piso + (1 − piso) × fração atingida).
# extent = "value" (valor em questão ÷ orçamento), "photos", "items", "documents", "services" (serviços pedidos sem item)
# ou "whole" (o chamado inteiro: desconta a severidade toda). Ex.: 1 foto fora do escopo em 6, Alto: 35 × (0,5 + 0,5/6) = 20.
proportional_floor = 0.5
# returns = true num tipo: falta do fornecedor (o que ajustar já está claro) → no máximo "Devolver ao fornecedor"
# caveats = true num tipo: ponto a esclarecer que não impede aprovar → no máximo "Aprovar com ressalvas"
# absorbs = ["tipo"] num tipo de apontamento: se os dois aparecem na mesma validação, o absorvido segue como evidência,
# mas não desconta (é o mesmo problema visto por outro ângulo; descontar os dois puniria duas vezes)

# da maior faixa para a menor
bands = [
  { score_min = 85, recommendation = "approve" },
  { score_min = 70, recommendation = "approve_with_caveats" },
  { score_min = 0, recommendation = "return_to_supplier" },
]

# quantos "redutores de confiança" levam a confiança média/baixa (baixa → análise detalhada)
confidence = { medium_with_n_reducers = 1, low_with_n_reducers = 2 }

price_tolerance_pct = 10     # acima da referência + tolerância vira apontamento
# Semelhança das fotos: phash + dhash (0 = idênticas, 128 = máximo), comparando também com recortes da foto antiga.
# Calibração (conjuntos de demonstração + validação, 248 fotos): cópias reenviadas ficaram em 0–11 e fotos distintas
# a partir de 18. O limite fica no meio do vão. Recalibre com fotos reais (generator/ e output/ ajudam a medir).
hash_max_distance = 14
hash_max_distance_low_detail = 6  # foto escura/tremida: hash perde poder de distinção, só cópia quase idêntica conta
hash_crops = [0.02, 0.05, 0.10]  # a foto antiga também é comparada recortada (fração de cada borda): pega cópia reenviada ou recortada
hash_min_detail = 9.0     # abaixo disso a foto é "pouco detalhe" (desvio das bordas numa miniatura 256 px)
hash_method = "phash + dhash (soma das distâncias de Hamming)"
spreadsheet_value_tolerance = 1.00   # R$ de diferença aceitos entre planilha e chamado
photo_date_tolerance_days = 1
# a partir desta fração do orçamento em questão, a nota de Orçamento fica limitada a 100 − % em questão
# (o apontamento relevant_amount_at_issue desconta o que falta para o teto; pesa quando muitos itens têm o mesmo problema)
relevant_amount_at_issue_pct = 10
# a partir desta fração do orçamento em questão, o chamado volta ao fornecedor qualquer que seja a nota (0 desliga)
max_amount_at_issue_for_caveats_pct = 30
# quantidade cobrada x quantidade que as fotos mostram (somando todas): acima de N% vira quantity_above_photos
photo_quantity_tolerance_pct = 25
# acima deste % do orçamento em questão, uma nota que aprovaria vira "Aprovar com ressalvas" (0 desliga)
max_amount_at_issue_for_approve_pct = 10
# preço de mercado anexado (anúncio, cotação): até N% acima não é apontado (margem do fornecedor sobre o varejo)
market_price_tolerance_pct = 25

# --- chamados da mesma agência (possível duplicidade) -------------------------------------------
# Antes de conferir o orçamento, o chamado é comparado com os outros chamados da MESMA agência (mesmo código; sem código,
# mesmo nome): os abertos até N dias antes ou depois da abertura deste e, com include_still_open, os que seguem abertos,
# qualquer que seja a data. O modelo lê os escopos e diz a chance (0–100%) de ser o mesmo problema; a regra decide:
# a partir de min_probability vira o apontamento possible_duplicate_ticket (análise detalhada); entre show_probability e
# min_probability o chamado aparece no parecer como relacionado, sem descontar.
[default.rubric.related_tickets]
enabled = true
window_days = 60
include_still_open = true
closed_statuses = ["approved", "rejected", "cancelled", "closed", "completed", "paid"]  # qualquer outra situação = aberto
min_probability = 70
show_probability = 40
max_candidates = 12  # com a janela de 60 dias; os mais próximos (ou da mesma categoria) primeiro

# --- causas especiais ---------------------------------------------------------------------------
# Vandalismo e desastre natural têm tratamento próprio (B.O., seguro, verba): o chamado precisa estar aberto com a causa
# certa. Cada causa lista os códigos de categoria ou sintoma (config/catalog.toml) que a indicam. A etapa "Categoria e
# solução" julga a causa pelas evidências (escopo, fotos, documentos, respostas do relatório) e, se não bater com a do
# chamado, gera cause_miscategorized. Ajuste os códigos aos do Salesforce.
[default.rubric.special_causes]
vandalism = ["vandalismo"]
natural_disaster = ["desastre_natural"]

# --- tipos de apontamento -----------------------------------------------------------------------
# amount_at_issue: "item" (o item inteiro), "excess" (só o que passa da referência/quantidade) ou "none"

[default.rubric.finding_types.vague_scope]
validation = "scope"
severity = "high"  # escopo vago impede conferir orçamento e fotos
reduces_confidence = true
description = "Escopo vago ou sem ambiente definido"

[default.rubric.finding_types.inconsistent_scope]
validation = "scope"
severity = "medium"
reduces_confidence = true
description = "Escopo incoerente com a categoria ou o sintoma"

# categoria e sintoma conferidos com TODAS as evidências (etapa "Categoria e solução", depois dos documentos);
# inconsistent_scope compara só o texto do escopo, então fica absorvido quando estes aparecem
[default.rubric.finding_types.cause_miscategorized]
validation = "scope"
severity = "high"
review = true  # vandalismo/desastre aberto como problema comum (ou o contrário): a pessoa analista confere antes de seguir
absorbs = ["inconsistent_scope", "miscategorized_ticket"]
description = "Vandalismo ou desastre natural com categoria ou sintoma errados"

[default.rubric.finding_types.miscategorized_ticket]
validation = "scope"
severity = "medium"
caveats = true  # a categoria não muda o serviço, mas precisa ser corrigida no chamado
absorbs = ["inconsistent_scope"]
description = "Categoria ou sintoma não correspondem ao problema"

# a solução (descrição da solução + itens do orçamento + o que fotos e documentos mostram) resolve o problema relatado?
[default.rubric.finding_types.solution_incoherent]
validation = "quote"
severity = "high"
returns = true  # a solução não trata o problema: o fornecedor revê a solução ou a justifica tecnicamente
description = "Solução não resolve o problema relatado"

[default.rubric.finding_types.solution_partially_coherent]
validation = "quote"
severity = "medium"
caveats = true  # trata só parte do problema (ex.: pinta sem tratar a infiltração): esclarecer antes de aprovar direto
description = "Solução resolve só parte do problema relatado"

[default.rubric.finding_types.out_of_scope_item]
extent = "value"
returns = true  # cobra o que não foi pedido: o orçamento precisa ser corrigido pelo fornecedor
validation = "quote"
severity = "high"
amount_at_issue = "item"
description = "Item fora do escopo"

[default.rubric.finding_types.unjustified_replacement]
extent = "value"
validation = "quote"
severity = "high"
amount_at_issue = "item"
description = "Troca ou peça sem justificativa técnica"

[default.rubric.finding_types.duplicate_item]
extent = "value"
returns = true  # cobra duas vezes: o orçamento precisa ser corrigido pelo fornecedor
validation = "quote"
severity = "high"
amount_at_issue = "item"
description = "Item cobrado em duplicidade"

[default.rubric.finding_types.quantity_above_expected]
extent = "value"
validation = "quote"
severity = "medium"
amount_at_issue = "excess"
description = "Quantidade acima do esperado"

[default.rubric.finding_types.unverifiable_quantity]
extent = "value"
validation = "quote"
severity = "medium"
reduces_confidence = true
amount_at_issue = "item"
description = "Quantidade não verificável pelo escopo"

[default.rubric.finding_types.relevant_amount_at_issue]
validation = "quote"
severity = "medium"
description = "Valor potencial divergente relevante no orçamento"

[default.rubric.finding_types.price_above_reference]
extent = "value"
validation = "quote"
severity = "medium"
amount_at_issue = "excess"
description = "Preço acima da referência"

[default.rubric.finding_types.scope_not_quoted]
extent = "services"
returns = true  # o orçamento não trata o que foi pedido: o fornecedor precisa ajustar (não é incerteza da entrada)
validation = "scope"
severity = "critical"
description = "Serviço pedido no chamado sem item no orçamento"

[default.rubric.finding_types.service_before_approval]
validation = "scope"
severity = "high"
description = "Serviço executado antes da aprovação do orçamento"

[default.rubric.finding_types.price_above_market]
extent = "value"
validation = "quote"
severity = "medium"
amount_at_issue = "excess"
description = "Preço acima do valor de mercado apresentado em documento"

[default.rubric.finding_types.price_not_comparable]
extent = "items"
caveats = true  # sem com o que comparar o preço: não aprova direto, aprova com ressalvas
validation = "quote"
severity = "low"
description = "Preço sem referência para comparar (fora da LPU e sem preço de mercado)"

[default.rubric.finding_types.similar_lpu_item]
extent = "items"
caveats = true  # a LPU tem item que faz o mesmo: o fornecedor orça por ele ou justifica (aprova no máximo com ressalvas)
validation = "quote"
severity = "low"
amount_at_issue = "excess"  # o que passa do preço do similar, quando a unidade é comparável
description = "Item Não LPU com similar na LPU"

[default.rubric.finding_types.quantity_above_photos]
extent = "value"
validation = "quote"
severity = "medium"
amount_at_issue = "excess"
description = "Quantidade cobrada acima do que as fotos mostram"

[default.rubric.finding_types.possible_duplicate_ticket]
validation = "scope"
severity = "high"
review = true  # pode ser o mesmo problema de outro chamado da agência: a pessoa analista confere antes de seguir
description = "Possível chamado duplicado na mesma agência"

[default.rubric.finding_types.spreadsheet_mismatch]
validation = "quote"
severity = "medium"
description = "Planilha divergente do chamado (categoria, sintoma, escopo ou valor)"

[default.rubric.finding_types.photo_mismatch]
extent = "photos"
validation = "photos"
severity = "high"
description = "Foto não corresponde ao escopo"

# relatório em PDF no formato checklist (SISR): a foto ao lado da pergunta contradiz a resposta marcada
# (ex.: "Câmera reposicionada para o caixa? Sim" e a foto mostra o estacionamento)
[default.rubric.finding_types.report_answer_contradicted]
extent = "photos"
validation = "photos"
severity = "high"
description = "Resposta do relatório contradita pela foto"

[default.rubric.finding_types.missing_after_photo]
validation = "photos"
severity = "high"
description = "Sem foto do serviço concluído"
absorbs = ["photo_mismatch"]  # a foto "do depois" de outro ambiente já é o motivo de faltar a prova do serviço

[default.rubric.finding_types.after_photo_unconfirmed_location]
validation = "photos"
severity = "medium"
reduces_confidence = true
description = "Foto do depois sem local confirmado"

[default.rubric.finding_types.item_without_photo]
extent = "items"
validation = "photos"
severity = "medium"
description = "Item cobrado sem evidência fotográfica"

[default.rubric.finding_types.missing_before_photo]
validation = "photos"
severity = "medium"
phase = 2
description = "Sem foto do \"antes\""

[default.rubric.finding_types.unreadable_photo]
extent = "photos"
validation = "photos"
severity = "low"
phase = 2
reduces_confidence = true
description = "Foto ilegível"

[default.rubric.finding_types.photo_dated_before]
extent = "photos"
validation = "photos"
severity = "medium"
phase = 2
description = "Foto com data anterior à abertura do chamado"

[default.rubric.finding_types.reused_photo]
validation = "photos"
severity = "critical"
phase = 2
lock = true
description = "Foto reaproveitada de outro chamado"

# --- documentos (leitura por OCR de fotos de documentos e PDFs) ---
[default.rubric.finding_types.unreadable_document]
extent = "documents"
validation = "photos"
severity = "low"
reduces_confidence = true
description = "Documento ilegível"

[default.rubric.finding_types.document_mismatch]
extent = "documents"
validation = "photos"
severity = "high"
description = "Documento não corresponde ao chamado"

[default.rubric.finding_types.document_date_inconsistent]
extent = "documents"
validation = "photos"
severity = "medium"
phase = 2
description = "Data do documento fora do período do chamado"
