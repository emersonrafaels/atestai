# Guia de demonstração: o que esperar de cada conjunto de chamados e o roteiro dos Casos Itaú - Salesforce.
# O painel mostra este arquivo na aba Cenários (GET /api/guide). Edite à mão; o painel lê a cada abertura da aba.
#
# [datasets.<nome>]   o que é o conjunto, o que esperar e dicas (nomes: scenarios, validation, itau, casos, uploaded)
# [[groups]]          temas do roteiro dos Casos Salesforce, na ordem de exibição
# [[cases]]           um chamado do conjunto casos:
#   expect            recomendações esperadas (approve, approve_with_caveats, return_to_supplier, return_locked,
#                     detailed_review, checklist_returned); mais de uma = o modelo real pode variar entre elas
#   findings          apontamentos que o parecer deve trazer (tipos da régua, config/rubric.toml)
#   show              o que mostrar na tela, em ordem
#   linked            outros chamados que entram na história (abrem com um clique)

[datasets.scenarios]
label = "Cenários de teste"
what = "Os casos do deck (00…) e o catálogo com um chamado por tipo de problema (0300…), todos com gabarito."
expect = "O parecer deve bater com o gabarito: a tabela do catálogo diz a recomendação, o score e os apontamentos esperados de cada chamado."
tips = [
  "No modo simulado o resultado é o próprio gabarito: serve para mostrar o fluxo e as telas, não a qualidade do modelo.",
  "No modo API dá para comparar o que o modelo achou com o esperado.",
]

[datasets.validation]
label = "Validação"
what = "80 chamados sintéticos com defeitos injetados de propósito (01…), cada um com gabarito."
expect = "Usado para medir o Atest.AI: a aba Validação roda uma amostra e mostra acurácia, erros por tipo e custo."
tips = [
  "Para um chamado específico, use os cartões 'Por tipo de problema' abaixo.",
  "Em demonstração, prefira a aba Validação à análise de um a um.",
]

[datasets.itau]
label = "Itaú"
what = "41 chamados sintéticos no formato do Itaú (02…), com gabarito: limpos, com ressalvas, devoluções e travas."
expect = "Recomendação e apontamentos do gabarito, como nos cenários. Bom para mostrar volume e variedade de categorias."
tips = ["Os cartões 'Por tipo de problema' mostram quais trazem cada defeito."]

[datasets.casos]
label = "Casos Itaú - Salesforce"
what = "14 chamados no formato do Salesforce (04…): 3 reconstituídos de chamados reais e 11 fictícios, montados para mostrar cada recurso do Atest.AI. As fotos são simuladas."
expect = "Não têm gabarito: analise no modo API (o simulado recusa). O esperado abaixo é o que foi plantado em cada caso (LEIAME.txt da pasta); o modelo real pode variar no score e em apontamentos menores."
tips = [
  "Para a duplicidade aparecer, os chamados da mesma agência precisam estar na base, e estão: o Atest.AI compara com os abertos até 60 dias antes ou depois e com os que seguem abertos.",
  "Marque o grupo inteiro com Selecionar e analise de uma vez; depois abra um por um.",
  "A agência pode vir só com o código, só com o nome ou com os dois: a comparação usa o que houver.",
]

[datasets.uploaded]
label = "Enviados pelo painel"
what = "Chamados que você mandou pelo botão Novo chamado."
expect = "Sem gabarito: só o modo API. Os chamados da mesma agência já cadastrados entram na comparação de duplicidade."
tips = []

# ------------------------------------------------------------------ roteiro dos Casos Salesforce

[[groups]]
id = "duplicate"
label = "Chamado duplicado na mesma agência"
description = "O Atest.AI compara o chamado com os da mesma agência (60 dias + os que seguem abertos) e marca quando é o mesmo problema."

[[groups]]
id = "reuse"
label = "Foto reaproveitada"
description = "Foto de outro chamado, recortada e com data nova: trava de integridade, devolve qualquer que seja a nota."

[[groups]]
id = "quote"
label = "Orçamento e solução"
description = "Preço, quantidade, troca sem justificativa, item fora do escopo e item Não LPU com similar na LPU."

[[groups]]
id = "agency"
label = "Mesma agência, outro problema"
description = "Contraprova da duplicidade: chamados da mesma agência que não devem ser marcados."

[[groups]]
id = "real"
label = "Reconstituídos do Salesforce"
description = "Chamados reais (textos e orçamentos do Salesforce), com fotos simuladas."

# duplicidade

[[cases]]
id = "04174102"
group = "duplicate"
title = "Forro do autoatendimento manchado e pingando"
expect = ["detailed_review"]
findings = ["possible_duplicate_ticket"]
show = [
  "Agência com nome e código (Campinas Cambuí, 1520).",
  "No topo do parecer, o aviso 'Possível chamado duplicado' com o 04174388, aberto 3 dias depois por outro fornecedor.",
  "Clique em 'Comparar os chamados': o modal põe os dois lado a lado (escopo, fotos, orçamento) e diz o que coincide.",
  "Na aba Agência, o 04161377 (split pingando) aparece como relacionado, sem virar duplicidade; porta giratória e tomada aparecem como outro problema.",
]
linked = ["04174388", "04161377", "04172318", "04174415"]
note = "O orçamento em si é coerente (preços da LPU): só a duplicidade leva à análise detalhada."

[[cases]]
id = "04174388"
group = "duplicate"
title = "Goteira no teto da sala dos caixas eletrônicos"
expect = ["detailed_review"]
findings = ["possible_duplicate_ticket"]
show = [
  "Agência só com o código (1520): a comparação acha os chamados pelo código.",
  "O aviso aponta o 04174102 como o mais antigo; no modal, use 'Abrir o chamado mais antigo'.",
  "Outra categoria e outro sintoma, mesmo problema: o modelo junta pelo local (ATM 4) e pela água no teto.",
  "Na aba Agência, o 04174415 não aparece: foi aberto só com o nome, e este só tem o código.",
]
linked = ["04174102", "04161377", "04172318"]

[[cases]]
id = "04174851"
group = "duplicate"
title = "Piso quebrado na área dos caixas eletrônicos"
expect = ["return_locked"]
findings = ["possible_duplicate_ticket", "reused_photo"]
show = [
  "Duplicado do 04164650, aberto 44 dias antes: dentro da janela de 60 dias da agência (e ainda aberto).",
  "As duas fotos são do 04164650, recortadas e com data nova, mandadas por outro fornecedor: 'Comparar' na foto mostra o par.",
  "A trava de integridade vence: o resultado é Devolver com trava, e o aviso de duplicidade continua no parecer.",
]
linked = ["04164650"]

[[cases]]
id = "04175207"
group = "duplicate"
title = "Hall dos caixas eletrônicos escuro"
expect = ["detailed_review"]
findings = ["possible_duplicate_ticket", "unjustified_replacement", "quantity_above_photos"]
show = [
  "Duplicado do 04168903 (lâmpada queimada no mesmo hall, 2 dias antes, outra categoria).",
  "No modal, compare os orçamentos: o antigo pede 2 lâmpadas, este troca 6 luminárias inteiras.",
  "As fotos mostram 2 luminárias apagadas: troca sem justificativa e quantidade acima do que as fotos mostram.",
]
linked = ["04168903"]

