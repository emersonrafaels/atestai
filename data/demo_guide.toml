# orçamento e solução

[[cases]]
id = "04172318"
group = "quote"
title = "Porta giratória travando sem motivo"
expect = ["return_to_supplier"]
findings = ["unjustified_replacement", "price_above_market", "price_above_reference", "out_of_scope_item", "photo_dated_before"]
show = [
  "O sintoma pede calibração; a solução troca a porta inteira (R$ 55.200).",
  "Item 1 83% acima do anúncio anexado (print da loja): preço acima do mercado.",
  "Placa e mão de obra acima da LPU; pintura da fachada fora do escopo.",
  "Uma foto tem data de março no EXIF, antes da abertura.",
]
linked = []
note = "Mesma agência dos casos de duplicidade (1520): aparece nas comparações deles como outro problema."

[[cases]]
id = "04173506"
group = "quote"
title = "Fechadura biométrica não reconhece digitais (atestação)"
expect = ["return_to_supplier"]
findings = ["unjustified_replacement", "price_above_reference", "quantity_above_expected", "photo_mismatch"]
show = [
  "Etapa de atestação (serviço feito), não de orçamento.",
  "A solução fala em limpeza e firmware; o orçamento cobra leitor e fechadura novos.",
  "Leitor 447% acima da LPU e 40 recadastramentos para 9 funcionários.",
  "A foto do depois é de uma catraca do saguão, não da porta da tesouraria.",
]
linked = ["04175012"]

[[cases]]
id = "04175012"
group = "quote"
title = "Sensor de presença da tesouraria com disparo falso"
expect = ["approve_with_caveats", "return_to_supplier"]
findings = ["quantity_above_expected", "price_above_reference"]
show = [
  "Escopo e solução falam de um sensor; o orçamento cobra 3 sensores e 3 mãos de obra.",
  "Sensor 36% acima da LPU.",
  "Na aba Agência, o 04173506 (leitor da mesma tesouraria, ainda aberto) aparece com chance baixa: mesmo ambiente, outro problema.",
]
linked = ["04173506"]

# item Não LPU com similar na LPU

[[cases]]
id = "04175318"
group = "quote"
title = "Divisória do arquivo rachada (parede removível × drywall)"
expect = ["approve_with_caveats"]
findings = ["similar_lpu_item", "price_not_comparable"]
show = [
  "Na aba Orçamento, o item 1 'Parede removível' vem como Não LPU, e o Atest.AI acha o similar na LPU: DRY-001, parede de drywall (R$ 145,00/m²).",
  "Cobrado a R$ 210,00/m² em 8 m²: R$ 520,00 acima do similar entram no valor potencial divergente.",
  "Contraste: o item 2 (retirada da divisória) também é Não LPU, mas não tem similar: 'Preço sem referência para comparar'.",
  "A mensagem ao fornecedor pede para orçar pelo item da LPU ou justificar o Não LPU.",
]
linked = []

[[cases]]
id = "04175420"
group = "quote"
title = "Sensor de presença do saguão sem detecção"
expect = ["approve_with_caveats"]
findings = ["similar_lpu_item"]
show = [
  "Item 1, sensor infravermelho Não LPU a R$ 245,00: similar na LPU ALA-002 (sensor IVP com fio, R$ 140,00), R$ 105,00 acima.",
  "Item 4, 'Deslocamento técnico' Não LPU: similar SIS-001 (visita técnica e deslocamento) pelo mesmo preço, apontado sem valor em questão.",
  "Os dois apontamentos levam a Aprovar com ressalvas.",
]
linked = []

